name: Deploy to GitHub Pages

# Optional: publish the static site via GitHub Actions.
# To use this, set Settings -> Pages -> Source to "GitHub Actions".
# Alternatively (and with zero config) use "Deploy from a branch" -> /(root).

on:
  push:
    branches:
      - claude/merchant-duplicates-report-hz4vyo
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The whole repo root is the site (files are already static).
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
